<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai tap 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <a class="nav-item active" href="#" aria-label="Elements"><span class="icon" style="--icon: url('element-4.svg')"></span></a>
            <a class="nav-item" href="#" aria-label="Graph"><span class="icon" style="--icon: url('graph.svg')"></span></a>
            <a class="nav-item" href="#" aria-label="Achievements"><span class="icon" style="--icon: url('medal-star.svg')"></span></a>
            <a class="nav-item" href="#" aria-label="Message"><span class="icon" style="--icon: url('messages.svg')"></span></a>
            <a class="nav-item" href="#" aria-label="Setting"><span class="icon" style="--icon: url('setting-2.svg')"></span></a>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="greeting"> 
                    <h2>Welcome, Amanda</h2>
                    <span class="date">Tue, 07 June 2022</span>
                </div>
                <div class="header-right">
                  <div class="searchbox">
                        <img src="search-normal.svg" alt="Search">
                        <input type="text" placeholder="Search">
                 </div>
                    <button class="notification">
                        <img src="notification-bing.svg" alt="Notification">
                    </button>
                    <img src="Rectangle 1072.svg" alt="Profile" class="avatar-sm">
                </div>
            </header>
                
            <div class="profile-container">
                <div class="banner">
                    <img src="Rectangle 6691.svg" alt="Cover Banner">
                </div>

             <div class="profile-body">
                    <div class="user-info-header">
                        <div class="user-info">
                           <img src="08f8792cc4560e6955e1cf3aa9aa4edfe7cc29bf.png" alt="Profile" class="avatar-lg">
                            <div class="detail">
                              <h3>Alexa Rawles</h3>
                              <p>alexarawles@gmail.com</p>
                            </div>
                       </div>
                        <button class="button-edit">Edit</button>
                    </div>

                    <form class="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                               <label>Full Name</label> 
                                <input type="text" placeholder="Your First Name">
                     </div>
                            <div class="form-group">
                                <label>Nick name</label>
                                <input type="text" placeholder="Your Nick Name">
                            </div>
                        </div>
                    
                        <div class="form-row">
                            <div class="form-group">
                                <label>Gender</label>
                                <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected hidden>Your Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>
                        </div>

                            <div class="form-group">
                                <label>Country</label>
                                <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected hidden>Your Country</option>
                                    <option value="vn">Vietnam</option>
                                </select>
                            </div>
                        </div>
                    </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Language</label>
                                <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected hidden>Your Language</option>
                                    <option value="en">English</option>
                                    <option value="vie">Vietnamese</option>
                                </select>
                            </div>
                        </div>
                            <div class="form-group">
                                <label>Time Zone</label>
                                <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected hidden>Your Time Zone</option>
                                    <option value="gmt+7">GMT +7</option>
                                </select>
                            </div>
                        </div>
                    </div>

                        <div class="email-section">
                            <h4>My email address</h4>
                            <div class="email-item">
                                <div class="email-icon">
                                    <img src="icon.svg" alt="Mail">
                                </div>
                                <div class="email-info">
                                    <p class="mail">alexarawles@gmail.com</p>
                                    <p class="time">1 month ago</p> 
                                </div>
                            </div>
                            <button type="button" class="addmail">+Add Email Address</button>
                        </div>  
                    </form>
                </div>
           </div>
        </main>
    </div>
</body>
</html>
